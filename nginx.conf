# ============================================================
# Nginx 配置示例：satmonitor-visual 生产环境部署
#
# 使用说明：
# 1. 把 dist/ 目录放到服务器 /var/www/satmonitor-visual/
# 2. 修改下方 proxy_pass 为你的真实后端地址
# 3. 把此文件复制到 /etc/nginx/conf.d/satmonitor-visual.conf
# 4. nginx -t && systemctl reload nginx
# ============================================================

server {
    listen 80;
    server_name _;  # 可改成你的域名，如 satmonitor.example.com

    # 前端静态资源
    location / {
        root /var/www/satmonitor-visual/dist/;

        # 缓存静态资源（js/css/图片/字体）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mp4|webm)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # SPA 路由回退：所有未知路径都返回 index.html
        try_files $uri $uri/ /index.html;
    }

    # API 代理：把 /satmonitor-visual/api/ 转发到真实后端
    location /satmonitor-visual/api/ {
        proxy_pass http://8.145.43.245:8989/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（如后端需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 安全响应头（可选）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
